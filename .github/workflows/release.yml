name: Release

# Building a tag like `v0.1.0` produces the prebuilt archives that `install.sh`
# and `install.ps1` download, one per supported target:
#
#   fast-text-<target>.tar.gz   (fast-text, ft, textwrite, tw, fast-text-gui)
#   fast-text-<target>.zip      the same, for Windows
#
# `install.sh` resolves `releases/latest/download/fast-text-<target>.tar.gz`
# for a default install and `releases/download/<tag>/fast-text-<target>.tar.gz`
# for `--version <tag>`; `install.ps1` uses the `.zip` asset the same way, so
# the asset name deliberately has no version in it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p fast-text-tui -p textwrite -p fast-text-gui

      - name: Package (Unix)
        if: runner.os != 'Windows'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          name="fast-text-${target}"
          mkdir -p "dist/${name}"
          for bin in fast-text ft textwrite tw fast-text-gui; do
            cp "target/${target}/release/${bin}" "dist/${name}/${bin}"
          done
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      # Windows gets a .zip: `install.ps1` unpacks it with Expand-Archive,
      # which needs no extra tooling on a stock Windows box.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = '${{ matrix.target }}'
          $name = "fast-text-$target"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          foreach ($bin in 'fast-text', 'ft', 'textwrite', 'tw', 'fast-text-gui') {
              Copy-Item "target/$target/release/$bin.exe" "dist/$name/$bin.exe"
          }
          Copy-Item LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          "asset=$name.zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: fast-text-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset || steps.package_windows.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # `gh` resolves the repository from the git remote, so the release job
      # needs a checkout even though it produces no build output itself.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in *.tar.gz *.zip; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Use the matching "## [x.y.z]" CHANGELOG section as the release body.
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            cat notes.md
          else
            echo "No CHANGELOG section for ${TAG}; GitHub will generate notes." >&2
            rm -f notes.md
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*.tar.gz artifacts/*.zip artifacts/*.sha256)
          if [ -f notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${notes[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --title "$TAG" --repo "$GITHUB_REPOSITORY" "${notes[@]}" "${assets[@]}"
          fi
