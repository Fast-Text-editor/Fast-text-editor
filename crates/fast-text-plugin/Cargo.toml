[package]
name = "fast-text-plugin"
description = "Scriptable plugin system for Fast Text, powered by Rhai."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
rhai = { version = "1.26", optional = true }

[features]
default = ["rhai"]
# The Rhai scripting engine. Frontends that only need the shared keymap (for
# example the WebAssembly build) turn this off to avoid shipping an interpreter.
rhai = ["dep:rhai"]
