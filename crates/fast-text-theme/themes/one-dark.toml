# one-dark — a built-in Fast Text theme.
name = "one-dark"
dark = true

[ui]
background = "#282c34"
foreground = "#abb2bf"
gutter = "#4b5263"
gutter_active = "#d7dae0"
cursor_line = "#2c313a"
selection = "#3e4451"
status_bg = "#21252b"
status_fg = "#abb2bf"
status_accent = "#61afef"
prompt_bg = "#2c313a"
tab_active = "#61afef"
tab_inactive = "#4b5263"
error = "#e06c75"
warning = "#e5c07b"

[syntax]
plain = "#abb2bf"
keyword = "#c678dd"
type = "#e5c07b"
function = "#61afef"
string = "#98c379"
number = "#d19a66"
comment = "#5c6370"
operator = "#56b6c2"
punctuation = "#abb2bf"
constant = "#d19a66"
attribute = "#e5c07b"
variable = "#e06c75"
