# solarized-dark — a built-in Fast Text theme.
name = "solarized-dark"
dark = true

[ui]
background = "#002b36"
foreground = "#839496"
gutter = "#586e75"
gutter_active = "#93a1a1"
cursor_line = "#073642"
selection = "#073642"
status_bg = "#073642"
status_fg = "#93a1a1"
status_accent = "#268bd2"
prompt_bg = "#073642"
tab_active = "#268bd2"
tab_inactive = "#586e75"
error = "#dc322f"
warning = "#b58900"

[syntax]
plain = "#839496"
keyword = "#859900"
type = "#b58900"
function = "#268bd2"
string = "#2aa198"
number = "#d33682"
comment = "#586e75"
operator = "#859900"
punctuation = "#839496"
constant = "#d33682"
attribute = "#268bd2"
variable = "#839496"
